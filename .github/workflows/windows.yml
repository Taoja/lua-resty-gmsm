# ============================================================================
#  Test::Nginx —— Windows x64（MSYS2 / MinGW-w64）版本
#
#  这不是把 Linux 版换个 runner 就行，有 4 处本质差异：
#
#  1. Windows 没有 RPATH/RUNPATH，-Wl,-rpath 完全无效。
#     等价做法：把 libcrypto-*.dll / libssl-*.dll 复制到 nginx.exe 同目录，
#     Windows 的 DLL 搜索顺序会优先命中"可执行文件所在目录"。
#
#  2. Windows 没有 fork() / POSIX signal / unix socket，
#     Test::Nginx 官方不支持 Windows（test-nginx#134 的补丁从未合并）。
#     所以本 workflow 默认只做「构建 + 链接断言 + 冒烟」，
#     prove 放在末尾 opt-in 开关后面，默认不跑。
#
#  3. OpenResty 的 Windows 构建只能走 MinGW-w64 + MSYS2，
#     官方 util/build-win32.sh 也是这条路，且必须用
#     --with-cc=gcc / --sbin-path=nginx.exe / -DFD_SETSIZE=1024 / --with-select_module。
#
#  4. 不能让 OpenResty 自己编译它自带的 luajit2：
#     luajit2 的 src/Makefile 在 HOST_SYS=Windows 时把 GIT_RELVER 写成 cmd.exe 语法
#     （if exist ..\.git ( git show ... ) else ( type ... )），而 MSYS2 的 make 用 sh
#     执行配方 → 语法错误 → luajit.h 生成不出来 → luajit-root 是空的 →
#     configure 报 "ngx_http_lua_module requires the LuaJIT library ... not found"。
#     本 workflow 改为手工从 bundle/LuaJIT-2.1-*/src 构建（覆盖 GIT_RELVER），
#     再用 --with-luajit=DIR 交给 OpenResty。
#
#  5. 路径有两套：MSYS2 视角 /c/opt/... 与 Windows 视角 C:\opt\...
#     configure 用 MSYS 路径（make install 才会真正落到 C:），
#     运行时 nginx -p 用 cygpath 转出来的 Windows 路径。
# ============================================================================

name: Test::Nginx (Windows x64)

on:
  push:
    branches: [main, master]
  pull_request:
  # 每周保活：GitHub 会删除 7 天未被访问的缓存条目，定时任务防止全矩阵缓存过期
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

defaults:
  run:
    shell: msys2 {0}

jobs:
  build:
    name: "Win64 | SSL ${{ matrix.ssl }} + OR ${{ matrix.or }}"
    # windows-2022 的 MSYS2/MinGW 组合比 windows-latest 更稳；需要时改成 windows-latest
    runs-on: windows-2022
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── tag 规则不一致，必须显式写死（与 Linux 版保持一致）──
          - ssl: "1.1.1w"
            ssl_tag: "OpenSSL_1_1_1w"
            or: "1.25.3.2"
            experimental: false

          - ssl: "3.0.22"
            ssl_tag: "openssl-3.0.22"
            or: "1.25.3.2"
            experimental: false

          - ssl: "3.6.4"
            ssl_tag: "openssl-3.6.4"
            or: "1.25.3.2"
            experimental: false

          - ssl: "4.0.2"
            ssl_tag: "openssl-4.0.2"
            or: "1.31.1.1"
            experimental: true

    env:
      OPENSSL_VERSION:   ${{ matrix.ssl }}
      OPENSSL_TAG:       ${{ matrix.ssl_tag }}
      OPENRESTY_VERSION: ${{ matrix.or }}
      # MSYS2 视角：configure / make install 用
      SSL_DIR: "/c/opt/openssl-${{ matrix.ssl }}"
      OR_DIR:  "/c/opt/openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}"
      LJ_DIR:  "/c/opt/luajit-${{ matrix.or }}"
      # Windows 视角：actions/cache / nginx -p 用（env context 不能用于 with，故缓存 path 直接写字面量）
      SSL_DIR_WIN: 'C:\opt\openssl-${{ matrix.ssl }}'
      OR_DIR_WIN:  'C:\opt\openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}'
      ZLIB_VERSION:  "1.3.1"
      PCRE2_VERSION: "10.44"

    steps:
      - uses: actions/checkout@v4

      # 仓库里若有 shell 脚本 / .t 数据文件，CRLF 会让 Test::Nginx 的
      # __DATA__ 段落多出 \r，直接导致断言失败
      - name: Force LF checkouts
        shell: bash
        run: git config --global core.autocrlf input

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          # 不用 UCRT64：OpenResty 官方 build-win32.sh 验证的是 MINGW64
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            perl
            curl

      - name: Sanity check toolchain
        run: |
          set -eux
          echo "MSYSTEM=$MSYSTEM"
          # 必须是 x86_64-w64-mingw32；若是 msys，说明 PATH 用错了 shell
          gcc -dumpmachine
          make --version | head -1
          perl -v | head -2

      # ================= OpenSSL =================
      - name: Restore OpenSSL
        id: ssl-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opt\openssl-${{ matrix.ssl }}
          key: win-ssl-${{ matrix.ssl }}-shared-v2

      - name: Build shared OpenSSL
        id: build-ssl
        if: steps.ssl-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /tmp/ssl-build
          cd /tmp/ssl-build

          case "$OPENSSL_VERSION" in
            1.*) SSL_SERIES="1.1.1" ;;
            *)   SSL_SERIES="$(echo "$OPENSSL_VERSION" | cut -d. -f1-2)" ;;
          esac

          ok=0
          for url in \
            "https://github.com/openssl/openssl/releases/download/${OPENSSL_TAG}/openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/old/${SSL_SERIES}/openssl-${OPENSSL_VERSION}.tar.gz"
          do
            echo "::group::try $url"
            if curl -fL --retry 3 --retry-delay 5 --max-time 300 \
                 -A "curl/8 GitHub-Actions" "$url" -o openssl.tar.gz; then
              ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
          done
          [ "$ok" = 1 ] || { echo "::error::找不到 OpenSSL ${OPENSSL_VERSION} 的源码包"; exit 1; }

          tar -xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"

          # mingw64 是 OpenSSL 官方支持的 MinGW-w64 target，1.1.1 / 3.x / 4.x 同名
          # no-asm：省掉 nasm 依赖，CI 里不差这点性能，但能避开 nasm 版本坑
          # 注意：Linux 版的 '-Wl,-rpath,$(LIBRPATH)' 在 Windows 上无效，已去掉
          ./Configure mingw64 \
            --prefix="$SSL_DIR" \
            --openssldir="$SSL_DIR/ssl" \
            shared \
            no-asm

          make -j"$(nproc)"

          # 三个目标分开跑、各自容错：
          #   install_sw     —— 运行时（openssl.exe + DLL）
          #   install_dev    —— 开发件（头文件 + .a + 导入库 .dll.a）
          #   install_ssldirs—— 证书/配置目录（1.1.1 无此目标）
          # 1.1.1 与 3.x 对"哪些文件算 sw、哪些算 dev"的划分不一致，
          # 只跑 install_sw 在 3.x 上会漏掉 libcrypto.dll.a。
          make install_sw
          make install_dev    || echo "::warning::install_dev 不可用"
          make install_ssldirs || echo "::warning::install_ssldirs 不可用（1.1.1 无此目标）"

          # ---- 归一化导入库位置 ----
          # MinGW 的导入库 libcrypto.dll.a / libssl.dll.a 落在哪，随 OpenSSL 大版本
          # 和安装目标而变：1.1.1 在 lib/，3.x 常见在 bin/（与 DLL 同目录）。
          # 下游只认 -L$SSL_DIR/lib，所以这里统一镜像到 lib/。
          mkdir -p "$SSL_DIR/lib"
          for n in libcrypto libssl; do
            found="$(ls "$SSL_DIR"/lib/$n.dll.a "$SSL_DIR"/bin/$n.dll.a \
                       "$SSL_DIR"/lib64/$n.dll.a 2>/dev/null | head -1)"
            [ -n "$found" ] || {
              echo "::error::未找到 $n 的导入库（.dll.a）"
              find "$SSL_DIR" -name "$n*" -print
              exit 1
            }
            [ -f "$SSL_DIR/lib/$n.dll.a" ] || cp "$found" "$SSL_DIR/lib/$n.dll.a"
            echo "$n 导入库 <- $found"
          done

          # ---- 瘦身 ----
          # .dll.a 是导入库，OpenResty 链接要用，绝不能删；只删真静态库 libcrypto.a/libssl.a
          rm -rf "$SSL_DIR/share" "$SSL_DIR/html" "$SSL_DIR/lib/pkgconfig"
          rm -f "$SSL_DIR/lib/libcrypto.a" "$SSL_DIR/lib/libssl.a"
          strip --strip-unneeded "$SSL_DIR/bin/"*.dll 2>/dev/null || true
          strip --strip-unneeded "$SSL_DIR/bin/openssl.exe" 2>/dev/null || true

      - name: Save OpenSSL
        if: always() && steps.build-ssl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\opt\openssl-${{ matrix.ssl }}
          key: win-ssl-${{ matrix.ssl }}-shared-v2

      - name: Assert OpenSSL build
        run: |
          set -eux
          "$SSL_DIR/bin/openssl.exe" version
          # openssldir 是 MSYS 风格路径，openssl.exe 只在需要读 openssl.cnf 时才用到；
          # nginx 走 libssl/libcrypto，不受影响
          ls -l "$SSL_DIR"/bin/libcrypto*.dll
          ls -l "$SSL_DIR"/bin/libssl*.dll
          # 导入库必须存在（构建步骤已归一化到 lib/）；命中旧缓存时这里会先炸，
          # 便于一眼看出是缓存问题而不是链接问题
          ls -l "$SSL_DIR/lib/libcrypto.dll.a" "$SSL_DIR/lib/libssl.dll.a"
          ls -l "$SSL_DIR/include/openssl/opensslv.h"
          # 链接期实测：能编出一个真用到 libcrypto 的可执行文件才算数
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          gcc -o /tmp/t.exe /tmp/t.c -I"$SSL_DIR/include" -L"$SSL_DIR/lib" -lssl -lcrypto \
            || { echo "::error::无法链接 OpenSSL"; ls -lR "$SSL_DIR/lib"; exit 1; }

      # ================= LuaJIT（必须先于 OpenResty configure）=================
      # 不能让 OpenResty 自己构建 LuaJIT：luajit2 的 src/Makefile 在 HOST_SYS=Windows
      # 时把 GIT_RELVER 定义成 cmd.exe 语法（if exist ..\.git ( git show ... ) else ( ... )），
      # 而 MSYS2 的 make 用 sh 执行配方 → "syntax error near unexpected token '('"
      # → luajit.h 生成不出来 → luajit-root 为空 → configure 报 "requires the LuaJIT library"。
      # 解决办法：自己从 bundle/ 里构建 luajit2，再从命令行覆盖 GIT_RELVER，
      # 最后用 --with-luajit=DIR 交给 OpenResty，绕开它内部那段构建。
      - name: Prepare OpenResty source + deps
        run: |
          set -euxo pipefail
          mkdir -p /tmp/or-build
          cd /tmp/or-build
          if [ ! -d "openresty-${OPENRESTY_VERSION}" ]; then
            curl -fL --retry 3 --retry-delay 5 --max-time 300 \
              "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" \
              -o openresty.tar.gz
            tar -xzf openresty.tar.gz
          fi
          cd "openresty-${OPENRESTY_VERSION}"

          # Windows 下必须自带 pcre2 / zlib 源码：nginx 的 auto/lib 探测
          # 在 MinGW 下找不到 MSYS2 的 /mingw64/{include,lib}
          mkdir -p objs/lib
          cd objs/lib
          if [ ! -d "pcre2-${PCRE2_VERSION}" ]; then
            curl -fL --retry 3 --max-time 300 \
              "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz" \
              -o pcre2.tar.gz
            tar -xzf pcre2.tar.gz
          fi
          if [ ! -d "zlib-${ZLIB_VERSION}" ]; then
            curl -fL --retry 3 --max-time 300 \
              "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
              -o zlib.tar.gz
            tar -xzf zlib.tar.gz
          fi
          cd ../..
          ls -d bundle/LuaJIT-2.1-*

      - name: Restore LuaJIT
        id: lj-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opt\luajit-${{ matrix.or }}
          key: win-luajit-${{ matrix.or }}

      - name: Build LuaJIT (MinGW, static)
        id: build-lj
        if: steps.lj-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "/tmp/or-build/openresty-${OPENRESTY_VERSION}"
          LJSRC="$(ls -d bundle/LuaJIT-2.1-* | head -1)"
          [ -n "$LJSRC" ] || { echo "::error::bundle 里没有 LuaJIT 源码"; ls -l bundle; exit 1; }
          cd "$LJSRC/src"

          # LuaJIT 的 Makefile 明确不支持并行（内部依赖关系靠顺序保证），必须 -j1
          # 顶层 Makefile 写着 "NOT useful for Windows"，MinGW 要在 src/ 下 make
          # GIT_RELVER 覆盖成 POSIX 写法：这是 Windows/MinGW 下这一行的官方绕过方式
          make -j1 \
            CC=gcc HOST_CC=gcc \
            TARGET_SYS=Windows \
            BUILDMODE=static \
            XCFLAGS="-DLUAJIT_NUMMODE=2 -DLUAJIT_ENABLE_LUA52COMPAT" \
            GIT_RELVER='(cat ../.relver 2>/dev/null || cat ../../.relver 2>/dev/null || echo 0) >luajit_relver.txt' \
            2>&1 | tee /tmp/luajit-build.log

          # ---- 手工"安装"（Windows 没有 make install）----
          mkdir -p "$LJ_DIR/bin" "$LJ_DIR/lib" "$LJ_DIR/include/luajit-2.1" "$LJ_DIR/share/lua/5.1"
          cp luajit.exe "$LJ_DIR/bin/"
          cp libluajit*.a "$LJ_DIR/lib/"
          cp lua.h lualib.h lauxlib.h luaconf.h luajit.h "$LJ_DIR/include/luajit-2.1/"
          cp -r jit "$LJ_DIR/share/lua/5.1/"
          ls -l "$LJ_DIR/lib/" "$LJ_DIR/include/luajit-2.1/"
          # 必须有 .a：OpenResty 用 -lluajit-5.1 链接
          ls "$LJ_DIR/lib/libluajit-5.1.a"

      - name: Save LuaJIT
        if: always() && steps.build-lj.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\opt\luajit-${{ matrix.or }}
          key: win-luajit-${{ matrix.or }}

      # ================= OpenResty =================
      - name: Restore OpenResty
        id: or-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opt\openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}
          key: win-or-${{ matrix.or }}-ssl${{ matrix.ssl }}-shared

      - name: Build OpenResty
        id: build-or
        if: steps.or-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p /tmp/or-build
          cd /tmp/or-build

          # 源码与 pcre2/zlib 已由上一个 step 准备好；缓存命中 Perl/OR 但源码被清时兜底
          if [ ! -d "openresty-${OPENRESTY_VERSION}" ]; then
            curl -fL --retry 3 --retry-delay 5 --max-time 300 \
              "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" \
              -o openresty.tar.gz
            tar -xzf openresty.tar.gz
          fi
          cd "openresty-${OPENRESTY_VERSION}"

          # 1.25 系只有 --with-pcre=，1.27+ 才有 --with-pcre2=，先探测再决定
          PCRE_OPT=""
          PCRE_JIT=""
          if ./configure --help 2>&1 | grep -q -- '--with-pcre2='; then
            PCRE_OPT="--with-pcre2=$PWD/objs/lib/pcre2-${PCRE2_VERSION}"
            if ./configure --help 2>&1 | grep -q -- '--with-pcre2-jit'; then
              PCRE_JIT="--with-pcre2-jit"
            fi
          elif ./configure --help 2>&1 | grep -q -- '--with-pcre='; then
            PCRE_OPT="--with-pcre=$PWD/objs/lib/pcre2-${PCRE2_VERSION}"
            if ./configure --help 2>&1 | grep -q -- '--with-pcre-jit'; then
              PCRE_JIT="--with-pcre-jit"
            fi
          fi
          echo "PCRE_OPT=$PCRE_OPT PCRE_JIT=$PCRE_JIT"

          # 不用 --with-openssl（静态链接，FFI 够不着）；
          # 用 -I / -L 指向已安装的 DLL + 导入库。
          # Windows 没有 rpath，链接期靠 -L 找 .dll.a，运行期靠下一行的 DLL 拷贝。
          # lua-cjson / lua-rds-parser 的 Makefile 在 MinGW 下链接 luajit 会踩坑，
          # 官方 build-win32.sh 也是直接关掉 rds 系列，这里照抄
          export LUAJIT_LIB="$LJ_DIR/lib"
          export LUAJIT_INC="$LJ_DIR/include/luajit-2.1"

          ./configure \
            --with-cc=gcc \
            --prefix="$OR_DIR" \
            --sbin-path=nginx.exe \
            --with-cc-opt="-DFD_SETSIZE=1024 -I$SSL_DIR/include" \
            --with-ld-opt="-L$SSL_DIR/lib -lssl -lcrypto" \
            $PCRE_OPT \
            $PCRE_JIT \
            --with-zlib="$PWD/objs/lib/zlib-${ZLIB_VERSION}" \
            --with-luajit="$LJ_DIR" \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-select_module \
            --without-http_rds_json_module \
            --without-http_rds_csv_module \
            --without-lua_rds_parser

          make -j"$(nproc)"
          make install

          # ---- RPATH 的 Windows 等价物：DLL 与 nginx.exe 同目录 ----
          cp "$SSL_DIR"/bin/libcrypto*.dll "$SSL_DIR"/bin/libssl*.dll "$OR_DIR/nginx/sbin/"

          # ---- 瘦身 ----
          rm -rf "$OR_DIR/luarocks" \
                 "$OR_DIR/pod" \
                 "$OR_DIR/site/pod" \
                 "$OR_DIR/site/man" \
                 "$OR_DIR/COPYRIGHT" \
                 "$OR_DIR/README" \
                 "$OR_DIR/bin/restydoc" \
                 "$OR_DIR/bin/restydoc-index" \
                 "$OR_DIR/bin/md2pod.pl" \
                 "$OR_DIR/bin/nginx-xml2pod"
          find "$OR_DIR" -name '*.pod' -delete 2>/dev/null || true
          strip --strip-unneeded "$OR_DIR/nginx/sbin/nginx.exe" 2>/dev/null || true

      - name: Save OpenResty
        if: always() && steps.build-or.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\opt\openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}
          key: win-or-${{ matrix.or }}-ssl${{ matrix.ssl }}-shared

      - name: Assert OpenResty linkage
        run: |
          set -eux
          NGX="$OR_DIR/nginx/sbin/nginx.exe"
          "$NGX" -V
          "$NGX" -V 2>&1 | grep -q "OpenSSL ${OPENSSL_VERSION}" \
            || { echo "::error::nginx 未链接 OpenSSL ${OPENSSL_VERSION}"; "$NGX" -V 2>&1; exit 1; }
          # Windows 下没有 ldd/readelf，用 binutils 的 objdump 看导入表
          DLL="$(cd "$OR_DIR/nginx/sbin" && ls libcrypto*.dll | head -1)"
          [ -n "$DLL" ] || { echo "::error::sbin 下没有 libcrypto*.dll"; ls -l "$OR_DIR/nginx/sbin"; exit 1; }
          objdump -p "$NGX" | grep -i "DLL Name: $DLL" \
            || { echo "::error::nginx.exe 未导入 $DLL"; objdump -p "$NGX" | grep -i 'DLL Name'; exit 1; }
          # 运行时确认：不靠 PATH，直接看进程能不能起来（下个 step 冒烟）

      # ================= 冒烟（Windows 上 Test::Nginx 的替代）=================
      # nginx/Windows 只有 select、单 worker、无 UDP，跑不了完整测试集；
      # 这里验证的是「真的能起来 + 真的在做 HTTP + 日志干净」
      - name: Smoke test
        run: |
          set -eux
          ROOT="$(pwd)/t/servroot"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/conf "$ROOT"/logs "$ROOT"/temp

          cat > "$ROOT/conf/nginx.conf" <<'EOF'
          worker_processes  1;
          error_log         logs/error.log warn;
          pid               logs/nginx.pid;
          events { worker_connections 1024; }
          http {
            access_log off;
            server {
              listen 127.0.0.1:1984;
              location / { return 200 "hello win64\n"; }
              location /ver { return 200 "$nginx_version"; }
            }
          }
          EOF

          ROOT_WIN="$(cygpath -w "$ROOT")"
          NGX="$OR_DIR/nginx/sbin/nginx.exe"

          "$NGX" -p "$ROOT_WIN" -c conf/nginx.conf -t
          "$NGX" -p "$ROOT_WIN" -c conf/nginx.conf

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:1984/" | grep -q "hello win64"; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:1984/" | grep -q "hello win64" \
            || { echo "::error::冒烟失败"; cat "$ROOT/logs/error.log"; exit 1; }

          # nginx/Windows 不支持 daemon off，-s quit 是唯一优雅退出方式
          "$NGX" -p "$ROOT_WIN" -c conf/nginx.conf -s quit || true
          sleep 2
          # MSYS_NO_PATHCONV 防止 /F 被当成路径转换
          MSYS_NO_PATHCONV=1 taskkill /F /IM nginx.exe /T 2>/dev/null || true
          cat "$ROOT/logs/error.log" || true

      - name: Report cache footprint
        run: |
          du -sh "$SSL_DIR" 2>/dev/null || true
          du -sh "$OR_DIR"  2>/dev/null || true

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-nginx-error-logs-ssl${{ matrix.ssl }}-or${{ matrix.or }}
          path: t/servroot/logs/
          if-no-files-found: ignore

      # ================= Test::Nginx（opt-in，默认关闭）=================
      # Test::Nginx 依赖 fork() / POSIX signal / unix socket，Windows 全都没有，
      # Strawberry Perl 的 fork 只是线程模拟，绝大多数 .t 会挂死或误报。
      # 打开方式：仓库 Settings → Secrets and variables → Variables
      #           新增 WINDOWS_TEST_NGINX = true
      # 打开后仍建议保持 continue-on-error，失败不代表回归。
      - name: Install Test::Nginx (opt-in)
        if: vars.WINDOWS_TEST_NGINX == 'true'
        shell: pwsh
        run: |
          cpanm --notest Test::Nginx IPC::Run
          perl -MTest::Nginx::Socket -e1

      - name: Run tests (opt-in)
        if: vars.WINDOWS_TEST_NGINX == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          TEST_NGINX_BINARY: 'C:\opt\openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}\nginx\sbin\nginx.exe'
        run: |
          $env:PATH = "C:\opt\openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}\nginx\sbin;$env:PATH"
          prove -r -v t
