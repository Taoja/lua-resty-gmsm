name: Test::Nginx

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "OpenSSL ${{ matrix.ssl }} + OpenResty ${{ matrix.or }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # 4.0 属于探索性组合，允许失败而不阻塞整体 CI
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── tag 规则不一致，必须显式写死 ──
          #   1.1.1 系列：tag = OpenSSL_1_1_1w ，tarball = openssl-1.1.1w.tar.gz
          #   3.x/4.x ：tag = openssl-3.6.4     ，tarball = openssl-3.6.4.tar.gz
          - ssl: "1.1.1w"
            ssl_tag: "OpenSSL_1_1_1w"
            or: "1.25.3.2"
            experimental: false

          - ssl: "3.0.22"
            ssl_tag: "openssl-3.0.22"
            or: "1.25.3.2"
            experimental: false

          - ssl: "3.6.4"
            ssl_tag: "openssl-3.6.4"
            or: "1.25.3.2"           # 3.6 顺带换新内核，与 4.0 保持同一 OpenResty 便于对比
            experimental: false

          - ssl: "4.0.2"
            ssl_tag: "openssl-4.0.2"
            or: "1.31.1.1"           # 必需：nginx < 1.31.1 编不过 OpenSSL 4.0
            experimental: true

    env:
      OPENSSL_VERSION:   ${{ matrix.ssl }}
      OPENSSL_TAG:       ${{ matrix.ssl_tag }}
      OPENRESTY_VERSION: ${{ matrix.or }}
      OPENSSL_PREFIX:   "/home/runner/opt/openssl-${{ matrix.ssl }}"
      OPENRESTY_PREFIX: "/home/runner/opt/openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}"

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl perl \
            cpanminus libipc-run-perl ccache \
            libpcre3-dev libpcre2-dev zlib1g-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # 按组合分桶，避免 4 个 OpenSSL 互相把对方的缓存挤掉
          key: ${{ runner.os }}-cc-${{ matrix.or }}-ssl${{ matrix.ssl }}
          max-size: 1G
          create-symlink: true
          evict-old-files: 'job'

      # ---------- OpenSSL（独立缓存，升 OpenResty 时不重编） ----------
      - name: Cache OpenSSL
        id: cache-ssl
        uses: actions/cache@v4
        with:
          path: /home/runner/opt/openssl-${{ matrix.ssl }}
          key: ssl-${{ runner.os }}-${{ matrix.ssl }}-shared

      - name: Build shared OpenSSL
        if: steps.cache-ssl.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/ssl-build"
          cd "${RUNNER_TEMP}/ssl-build"

          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=time_macros

          # 主源 GitHub（tag 规则随大版本变化），失败再回落 openssl.org
          # 1.1.1/3.0 这类老版本归档在 /source/old/<分支>/ 下
          ok=0
          for url in \
            "https://github.com/openssl/openssl/releases/download/${OPENSSL_TAG}/openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/old/${OPENSSL_VERSION%.*}/openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/old/1.1.1/openssl-${OPENSSL_VERSION}.tar.gz"
          do
            echo "::group::try $url"
            if curl -fL --retry 3 --retry-delay 5 --max-time 300 "$url" -o openssl.tar.gz; then
              ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
          done
          [ "$ok" = 1 ] || { echo "::error::找不到 OpenSSL ${OPENSSL_VERSION} 的源码包"; exit 1; }

          tar -xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"

          # 关键三点：
          #   1. shared          —— 必须产出 libcrypto.so*，FFI 才能 dlopen
          #   2. '-Wl,-rpath,$(LIBRPATH)' —— 单引号，让 make 展开；否则 openssl 会链到系统库
          #   3. --enable-new-dtags        —— 生成 RUNPATH，保证 LD_LIBRARY_PATH 能覆盖
          ./Configure \
            --prefix="$OPENSSL_PREFIX" \
            --openssldir="$OPENSSL_PREFIX/ssl" \
            --libdir=lib \
            shared \
            '-Wl,-rpath,$(LIBRPATH)' \
            -Wl,--enable-new-dtags

          make -j"$(nproc)"
          make install_sw install_ssldirs
          ccache -s

      # 无论是否命中缓存，都做一次硬校验（缓存内容可能是坏的）
      - name: Assert OpenSSL build
        run: |
          set -eux
          "$OPENSSL_PREFIX/bin/openssl" version

          # soname 随大版本变：1.1.1 → libcrypto.so.1.1，3.x → .so.3，4.x 另行演进
          LIBCRYPTO="$(ls "$OPENSSL_PREFIX"/lib/libcrypto.so.* 2>/dev/null | head -1)"
          [ -n "$LIBCRYPTO" ] || { echo "::error::未找到 libcrypto.so.*"; ls -l "$OPENSSL_PREFIX/lib"; exit 1; }
          echo "libcrypto = $LIBCRYPTO"

          readelf -d "$LIBCRYPTO"                  | grep -E 'RPATH|RUNPATH'
          readelf -d "$OPENSSL_PREFIX/bin/openssl" | grep -E 'RPATH|RUNPATH'
          ldd "$OPENSSL_PREFIX/bin/openssl" | grep -E 'libcrypto|libssl' \
            | grep -q "$OPENSSL_PREFIX" \
            || { echo "::error::openssl 仍链到系统库"; ldd "$OPENSSL_PREFIX/bin/openssl"; exit 1; }

      # ---------- OpenResty（动态链接到上面的 OpenSSL） ----------
      - name: Cache OpenResty
        id: cache-or
        uses: actions/cache@v4
        with:
          path: /home/runner/opt/openresty-${{ matrix.or }}-ssl${{ matrix.ssl }}
          key: or-${{ runner.os }}-${{ matrix.or }}-ssl${{ matrix.ssl }}-shared

      - name: Build OpenResty
        if: steps.cache-or.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/or-build"
          cd "${RUNNER_TEMP}/or-build"

          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=time_macros

          curl -fL --retry 3 --retry-delay 5 --max-time 300 \
            "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" \
            -o openresty.tar.gz
          tar -xzf openresty.tar.gz
          cd "openresty-${OPENRESTY_VERSION}"

          # OpenResty 1.31 起内核自带 PCRE2，--with-pcre-jit 可能不再存在，
          # 而 nginx configure 遇到未知选项会直接 error 退出，所以先探测
          PCRE_OPT=""
          if ./configure --help 2>&1 | grep -q 'with-pcre2-jit'; then
            PCRE_OPT="--with-pcre2-jit"
          elif ./configure --help 2>&1 | grep -q 'with-pcre-jit'; then
            PCRE_OPT="--with-pcre-jit"
          fi
          echo "PCRE_OPT=$PCRE_OPT"

          # 不用 --with-openssl（那是静态链接，FFI 够不着）
          # 改用 -I / -L 指向已安装的共享库，并把 rpath 编进 nginx
          ./configure \
            --prefix="$OPENRESTY_PREFIX" \
            $PCRE_OPT \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-luajit \
            --with-stream \
            --with-stream_ssl_module \
            --with-cc-opt="-I$OPENSSL_PREFIX/include" \
            --with-ld-opt="-L$OPENSSL_PREFIX/lib -Wl,-rpath,$OPENSSL_PREFIX/lib -Wl,--enable-new-dtags"

          make -j"$(nproc)"
          make install
          ccache -s

      - name: Assert OpenResty linkage
        run: |
          set -eux
          "$OPENRESTY_PREFIX/nginx/sbin/nginx" -V
          "$OPENRESTY_PREFIX/nginx/sbin/nginx" -V 2>&1 \
            | grep -q "OpenSSL ${OPENSSL_VERSION}" \
            || { echo "::error::nginx 未链接 OpenSSL ${OPENSSL_VERSION}"; exit 1; }
          ldd "$OPENRESTY_PREFIX/nginx/sbin/nginx" | grep -E 'libcrypto|libssl' \
            | grep -q "$OPENSSL_PREFIX" \
            || { echo "::error::nginx 的 libcrypto 未指向 $OPENSSL_PREFIX"; \
                 ldd "$OPENRESTY_PREFIX/nginx/sbin/nginx" | grep -E 'libcrypto|libssl'; exit 1; }

      # ---------- Test::Nginx ----------
      - name: Cache Perl modules
        uses: actions/cache@v4
        with:
          path: /home/runner/perl5
          key: perl5-${{ runner.os }}-test-nginx

      - name: Install Test::Nginx
        run: |
          set -eux
          PERL_ARCH="$(perl -MConfig -e 'print $Config{archname}')"
          export PERL5LIB="$HOME/perl5/lib/perl5:$HOME/perl5/lib/perl5/$PERL_ARCH"
          echo "PERL5LIB=$PERL5LIB" >> "$GITHUB_ENV"
          cpanm --notest --local-lib="$HOME/perl5" Test::Nginx IPC::Run \
            > build.log 2>&1 || (cat build.log && exit 1)
          perl -MTest::Nginx::Socket -e1

      # ---------- 运行 ----------
      - name: Setup runtime env
        run: |
          set -eux
          echo "$OPENRESTY_PREFIX/nginx/sbin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -eux
          prove -r -v t

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-error-logs-ssl${{ matrix.ssl }}-or${{ matrix.or }}
          path: t/servroot/logs/
          if-no-files-found: ignore
